name: Build and validate Android APKs
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radek-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Android SDK and licenses
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: platform-tools
      - name: Install pinned platform, build tools, NDK and CMake
        run: python3 tools/ci_run.py sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Configure Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5
      - name: Build native analyzer and run C++ runtime tests
        run: python3 tools/build_native.py
      - name: AddressSanitizer and UndefinedBehaviorSanitizer tests
        run: python3 tools/ci_run.py bash tools/test_sanitized.sh
      - name: Host tests and real signed synthetic IPA conversions
        env:
          RADEK_REQUIRE_ANDROID: '1'
        run: python3 tools/ci_run.py python3 -m unittest discover -v
      - name: Android unit tests, lint, JNI native build and APK
        run: python3 tools/ci_run.py ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Validate converter application APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/RadekiOSConventor-debug.apk
          python3 -m radek validate artifacts/RadekiOSConventor-debug.apk --package dev.radek.conventor --entry dev.radek.conventor.MainActivity --converter-app > artifacts/validation.json
      - name: Verify the bundled converted-app runtime DEX
        run: |
          grep -n "bundleRuntimeDex" gradle.log || true
          ls -la app/build/generated/runtimeAssets/assets/ || true
          python3 - <<'PY'
          import sys, zipfile

          apk = zipfile.ZipFile("artifacts/RadekiOSConventor-debug.apk")
          names = apk.namelist()
          if "assets/runtime.dex" not in names:
              print("::error::assets/runtime.dex is missing from the converter APK; asset entries: "
                    + ", ".join(sorted(n for n in names if n.startswith("assets"))[:20]))
              sys.exit(1)
          info = apk.getinfo("assets/runtime.dex")
          data = apk.read("assets/runtime.dex")
          if info.file_size <= 512 or data[:4] != b"dex\n" or data[4:7] != b"035":
              print(f"::error::runtime.dex is not a usable DEX ({info.file_size} bytes, header {data[:8]!r})")
              sys.exit(1)
          print("runtime.dex:", info.file_size, "bytes, version", data[4:7].decode())
          PY
      - name: Build and validate standalone native fixture artifact
        run: |
          python3 tools/make_fixture.py --output .local/fixture.ipa
          python3 -m radek convert .local/fixture.ipa --authorized --output .local/fixture-result
      - name: Convert armv6 and Thumb fixtures (old 32-bit iOS games)
        run: |
          for arch in armv6 armv6thumb armv7 armv7s thumb thumb2; do
            python3 tools/make_fixture.py --arch "$arch" --output ".local/fixture-$arch.ipa"
            python3 -m radek convert ".local/fixture-$arch.ipa" --authorized --output ".local/fixture-$arch-result"
          done
      - name: Upload RadekiOSConventor APK
        uses: actions/upload-artifact@v6
        with:
          name: RadekiOSConventor-debug.apk
          path: artifacts/RadekiOSConventor-debug.apk
          if-no-files-found: error
      - name: Upload standalone converted fixture (not the converter UI)
        uses: actions/upload-artifact@v6
        with:
          name: standalone-native-fixture
          path: |
            .local/fixture-result/RadekiOSConventor-debug.apk
            .local/fixture-result/report.json
            .local/fixture-result/conversion.jsonl
          if-no-files-found: error
      - name: Upload test reports
        if: always() && hashFiles('app/build/reports/**', 'artifacts/validation.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: test-and-validation-reports
          path: |
            app/build/reports/
            artifacts/validation.json
          if-no-files-found: error
