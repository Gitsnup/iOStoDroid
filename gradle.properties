org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Build-time only: the app, the compat runtime and the three template modules are
# independent, so parallel execution and the build cache shorten local and CI
# builds without changing any task output or ordering (template embedding keeps
# its explicit dependsOn edges).
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
